<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Sitemap</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <style>
      site-map {
        ul {
          list-style-position: inside;
          list-style-type: none;
          line-height: 1.2em; /* Empirically largest w no gap */
          padding-inline-start: 0;
          & ul {
            & li {
              padding-inline-start: 1rem;
              &:last-child {
              }
            }
          }
        }
      }
    </style>
    <p>Ordered by directory structure</p>
    <site-map>
      <render- if="false">
        This is always dropped, unless `rootSelector: 'template-'`. So this
        works with no custom DOM manipulation. Will probably make it a
        first-level thing at some point.
        <ul id="my-template-li">
          <render-
            map="Object.entries(directoryContents).map(([dir, contents]) => ({ dir, contents, fileDetails: typeof contents === 'string' && fileCache.getByContentPath(contents) }))"
          >
            <li>
              <render- if="typeof item.contents === 'string'">
                <set-
                  ipath="item.contents, goodHref"
                  iname="or(item.fileDetails?.meta?.title, item.fileDetails?.name)"
                >
                </set->
                <a x-href=" ipath" x-content="iname"></a>
                <render- if="parameters.static === undefined">
                  -
                  <a x-href="`${ipath}?edit`" x-title="`Edit ${iname}`">Edit</a>
                </render->
              </render->
              <render- if="typeof item.contents !== 'string'">
                <details>
                  <summary x-content="`/${item.dir}/`"></summary>
                  <ul>
                    <render-
                      content="render(contentPath, {...parameters, rootSelector: '#my-template-li', directoryContents: item.contents, contentPath })"
                    />
                  </ul>
                </details>
              </render->
            </li>
          </render->
        </ul>
      </render->
      <ul>
        <li>
          <a href="/">/</a>
          <render-
            content="render(contentPath, {...parameters, rootSelector: '#my-template-li', directoryContents: (await site.fileTree), contentPath })"
          >
          </render->
        </li>
      </ul>
    </site-map>
  </body>
</html>
