<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <render- if="dialog!==undefined">
      <meta itemprop="nocontainer" />
    </render->
    <title>Search and Link</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <render- if="dialog!==undefined">
      <link
        rel="stylesheet"
        href="/system/global.css"
        type="text/css"
        media="screen"
      />

      <style>
        :root {
          font-size: 14px;
        }
        body {
          padding: var(--space-half);
          box-sizing: border-box;
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
          margin-block: var(--space-half);
          font-size: 1rem;
          font-weight: bold;
        }
      </style>
    </render->

    <style>
      textarea {
        height: 3rem;
      }

      [copy-target-container]:has([copy]:hover) {
        [copy-target] {
          background-color: var(--bg-lighter);
        }
      }

      li:not(:last-child) {
        margin-bottom: var(--space-half);
      }

      ul {
        list-style: none;
      }
    </style>
    <script src="/system/scripts/copy-and-insert.js"></script>
    <form method="GET">
      <render- if="dialog!==undefined">
        <input type="hidden" name="dialog" value="dialog" />
        <input type="hidden" name="contentPath" x-value="contentPath" />
      </render->
      <textarea
        autofocus
        name="query"
        x-content="or(query,'')"
        placeholder="Search here"
      >
      </textarea>
      <button type="submit" x-formaction="contentPath">Go</button>
    </form>
    <render- if="query!==undefined">
      <set- result="site.search(query.trim())"> </set->
      <h2>Results</h2>
      <ul>
        <render- map="result" allow-one>
          <set-
            ipath="item.contentPath"
            ititle="or(item.meta.title,item.name)"
            iname="item.name"
            markdownlink='`[${ititle}](<${ipath}> "${iname}")`'
            atag='`<a href="${ipath}" title="${ititle}">${iname}</a>`'
          >
          </set->
          <li copy-target-container>
            <div class="flex-row justify-between">
              <render- if="dialog===undefined">
                <span>
                  <a
                    copy-target
                    x-href="ipath"
                    x-title="iname"
                    x-content="ititle"
                  />
                  <render- if="parameters.static === undefined">
                    -
                    <a
                      copy-target
                      x-href="`${ipath}?edit`"
                      x-title="`Edit ${iname}`"
                      >Edit</a
                    >
                  </render->
                </span>
              </render->
              <render- if="dialog!==undefined">
                <span x-title="iname" x-content="ititle" />
              </render->
              <div>
                <render- if="dialog===undefined">
                  <div>
                    Copy
                    <button type="button" x-copy="atag" title="Copy HTML link">
                      <code>&lt;a&gt;</code>
                    </button>
                    <button
                      type="button"
                      x-copy="markdownlink"
                      title="Copy Markdown link"
                    >
                      <code>[]()</code>
                    </button>
                    <button type="button" x-copy="ipath" title="Copy path">
                      Path
                    </button>
                  </div>
                </render->
                <render- if="dialog!==undefined">
                  <div>
                    Insert
                    <button
                      type="button"
                      x-insert="atag"
                      title="Insert HTML link"
                    >
                      <code>&lt;a&gt;</code>
                    </button>
                    <button
                      type="button"
                      x-insert="markdownlink"
                      title="Insert Markdown link"
                    >
                      <code>[]()</code>
                    </button>
                    <button type="button" x-insert="ipath" title="Insert path">
                      Path
                    </button>
                  </div>
                </render->
              </div>
            </div>
          </li>
        </render->
      </ul>
    </render->
    <render- if="query===undefined">
      <p>Type a query and hit "Go" to see the results here</p>
    </render->
  </body>
</html>
