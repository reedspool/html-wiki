<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Fixture Example</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <h1>Fixture HTML Example File</h1>

    <p>Kitchen sink of HTML templating features.</p>

    <p>
      Below should render the contents of
      <a href="./fixture.fragment.html">the fragment fixture</a>:
    </p>
    <render- content="render('/fixtures/fixture.fragment.html')" />

    <set-
      externally_loaded="load('/fixtures/test-to-load.mts')"
      externally_loaded_relative="load('./test-to-load-relative.mts')"
    />

    <p>
      <span
        test-load-function
        x-content="externally_loaded?.exportedFunction()"
      >
      </span
      >.
      <span test-load-default x-content="externally_loaded?.default"> </span>
    </p>

    <p>
      <span
        test-load-relative-function
        x-content="externally_loaded_relative?.exportedFunction()"
      >
      </span
      >.
      <span
        test-load-relative-default
        x-content="externally_loaded_relative?.default"
      >
      </span>
    </p>
  </body>
</html>
